model_list:
  - model_name: llama-smart
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-chat-v4-0324
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-reasoner-v4-0324
      api_key: os.environ/DEEPSEEK_API_KEY

  # ── Fallback models (used only when primary fails) ─────────────────────────
  # Keys are optional — set ANTHROPIC_API_KEY and/or OPENAI_API_KEY in .env
  # to enable automatic failover when DeepSeek is down or rate-limited.
  - model_name: claude-fallback
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-fallback
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  # If deepseek-v4-pro fails (429 / 5xx), try claude then gpt before erroring
  fallbacks:
    - deepseek-v4-pro: [claude-fallback, gpt-fallback]
    - deepseek-v4-flash: [claude-fallback]
  # Retry on rate limit and server errors
  num_retries: 2
  retry_after: 5

general_settings:
  master_key: sk-pantheon-local