name: fix-failing-test
description: Read code, find an off-by-one bug, fix it with a targeted edit, and leave the test alone.
prompt: >
  `node test.js` fails. Find the bug in src/range.js and fix it.
  Do not modify test.js.
files:
  package.json: |
    { "name": "range", "version": "1.0.0", "scripts": { "test": "node test.js" } }
  src/range.js: |
    // Returns the integers from start to end, inclusive.
    function range(start, end) {
      const out = [];
      for (let i = start; i < end; i++) {
        out.push(i);
      }
      return out;
    }
    module.exports = { range };
  test.js: |
    const assert = require("node:assert");
    const { range } = require("./src/range.js");
    assert.deepStrictEqual(range(1, 3), [1, 2, 3]);
    assert.deepStrictEqual(range(5, 5), [5]);
    console.log("ok");
checks:
  - command: node test.js
  - file_contains: { path: test.js, text: "assert.deepStrictEqual(range(1, 3), [1, 2, 3]);" }
  - tool_called: edit_file
